sonar.projectKey=com.nice.cognigy-echo-click-to-call-widget
sonar.projectName=cognigy-echo-click-to-call-widget

sonar.sources=.
sonar.tests=.
sonar.sourceEncoding=UTF-8

# mockServiceWorker.js is generated by msw; public/sounds.js is ~1MB of base64 audio data.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/mockServiceWorker.js,\
  public/sounds.js

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage (enable once CI emits reports, see section 3 of
# https://cognigy.atlassian.net/wiki/spaces/Engineering/pages/2559967260):
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
