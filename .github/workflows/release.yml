name: Release

on:
  workflow_dispatch:

permissions:
  contents: write   # push tag + create GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Compute next version
        id: version
        run: |
          NEXT="$(bash .github/compute-next-version.sh)"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT (tag v$NEXT)"

      - name: Set package version locally
        run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          VERSION="${{ steps.version.outputs.next }}"
          if npm view "@cognigy/click-to-call-widget@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already published to npm — skipping publish."
          else
            npm publish --provenance --access public
          fi

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/webRTCWidget.js
