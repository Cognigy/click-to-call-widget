name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never cancel a release that is already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Remove superseded draft releases and their version tags
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .target_commitish == "main") | .tag_name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))')
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes --cleanup-tag
            if [ -n "$(git tag --list "$tag")" ]; then
              git tag --delete "$tag"
            fi
          done <<< "$tags"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
