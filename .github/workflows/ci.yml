name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Set up mock config for CI
        run: cp src/mocks/mock.example.json src/mocks/mock.json
      - run: npm run lint
      - name: Test next-version helper
        run: bash .github/compute-next-version.test.sh
      - run: npm run build
      - run: npm test
